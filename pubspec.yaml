name: my_first_app
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  google_fonts: ^6.1.0
  shared_preferences: ^2.1.1
  cupertino_icons: ^1.0.6
  flutter_staggered_grid_view: ^0.7.0
  animations: ^2.0.8
  url_launcher: ^6.3.0
  provider: ^6.1.2
  uuid: ^3.0.6
  share_plus: ^10.0.2
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  cloud_firestore: ^5.4.3  
  firebase_core: ^3.6.0     
  geocoding: ^3.0.0
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#320064" # <--- Metti il codice esatto qui!
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png